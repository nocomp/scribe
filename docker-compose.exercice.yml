# ── SCRIBE — docker-compose.exercice.yml ─────────────────────────────────
# Mode EXERCICE multi-instances : 1 collecteur animateur + 7 sites joueurs
#
# Architecture :
#   - collecteur_exo (8565)   : interface animateur, scénarios, supervision
#   - 7 instances joueur (8660-8666) : SCRIBE en mode exercice, données fictives
#
# Usage :
#   docker compose -f docker-compose.exercice.yml up -d
#   docker compose -f docker-compose.exercice.yml logs -f
#   docker compose -f docker-compose.exercice.yml down
#
# Connexion :
#   - Animateur     → http://localhost:8565  (login: dircrise / Exercice2026!)
#   - CH_NORD       → http://localhost:8660
#   - CH_SUD        → http://localhost:8661
#   - CHU_CENTRE    → http://localhost:8662
#   - CH_EST        → http://localhost:8663
#   - CH_OUEST      → http://localhost:8664
#   - CLINIQUE_DEMO → http://localhost:8665
#   - CH_NORD_2     → http://localhost:8666 (slot 7 disponible)
#
# Pour personnaliser les sigles/ports : modifier la variable
# SCRIBE_EXO_INSTANCES dans le service collecteur_exo + adapter les services
# joueurs ci-dessous.
# ─────────────────────────────────────────────────────────────────────────

x-joueur-common: &joueur-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: on-failure:3
  environment:
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - SCRIBE_EXO_HOST=${SCRIBE_EXO_HOST:-http://collecteur_exo}
    # IA (optionnel pour les joueurs, principalement utilisé côté collecteur)
    - SCRIBE_IA_PROVIDER=${SCRIBE_IA_PROVIDER:-albert}
    - SCRIBE_IA_KEY=${SCRIBE_IA_KEY:-}
    - SCRIBE_IA_MODEL=${SCRIBE_IA_MODEL:-}
    - SCRIBE_IA_URL=${SCRIBE_IA_URL:-}
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  # ── Collecteur animateur ───────────────────────────────────────────────
  collecteur_exo:
    build:
      context: .
      dockerfile: Dockerfile.exercice
    container_name: scribe_collecteur_exo
    restart: on-failure:3
    ports:
      - "${SCRIBE_EXO_COLLECTEUR_PORT:-8565}:8565"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Sigles des sites joueurs visibles depuis le collecteur (DNS interne Docker)
      - SCRIBE_EXO_HOST=http://localhost
      - SCRIBE_EXO_INSTANCES=CH_NORD:8660,CH_SUD:8661,CHU_CENTRE:8662,CH_EST:8663,CH_OUEST:8664,CLINIQUE_DEMO:8665,CH_NORD_2:8666
      - SCRIBE_IA_PROVIDER=${SCRIBE_IA_PROVIDER:-albert}
      - SCRIBE_IA_KEY=${SCRIBE_IA_KEY:-}
      - SCRIBE_IA_MODEL=${SCRIBE_IA_MODEL:-}
      - SCRIBE_IA_URL=${SCRIBE_IA_URL:-}
    volumes:
      - scribe_exo_data:/data
    network_mode: host  # Permet au collecteur de joindre les joueurs via localhost:866X
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8565/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Instance joueur 1 — CH_NORD ────────────────────────────────────────
  joueur_ch_nord:
    <<: *joueur-common
    container_name: scribe_joueur_ch_nord
    network_mode: host
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SCRIBE_CONFIG=/app/config_exo_ch_nord.xml
      - SCRIBE_PORT=8660
      - DATABASE_URL=sqlite:////data/scribe_exo_ch_nord.db
    volumes:
      - scribe_exo_data:/data

  # ── Instance joueur 2 — CH_SUD ─────────────────────────────────────────
  joueur_ch_sud:
    <<: *joueur-common
    container_name: scribe_joueur_ch_sud
    network_mode: host
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SCRIBE_CONFIG=/app/config_exo_ch_sud.xml
      - SCRIBE_PORT=8661
      - DATABASE_URL=sqlite:////data/scribe_exo_ch_sud.db
    volumes:
      - scribe_exo_data:/data

  # ── Instance joueur 3 — CHU_CENTRE ─────────────────────────────────────
  joueur_chu_centre:
    <<: *joueur-common
    container_name: scribe_joueur_chu_centre
    network_mode: host
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SCRIBE_CONFIG=/app/config_exo_chu_centre.xml
      - SCRIBE_PORT=8662
      - DATABASE_URL=sqlite:////data/scribe_exo_chu_centre.db
    volumes:
      - scribe_exo_data:/data

  # ── Instance joueur 4 — CH_EST ─────────────────────────────────────────
  joueur_ch_est:
    <<: *joueur-common
    container_name: scribe_joueur_ch_est
    network_mode: host
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SCRIBE_CONFIG=/app/config_exo_ch_est.xml
      - SCRIBE_PORT=8663
      - DATABASE_URL=sqlite:////data/scribe_exo_ch_est.db
    volumes:
      - scribe_exo_data:/data

  # ── Instance joueur 5 — CH_OUEST ───────────────────────────────────────
  joueur_ch_ouest:
    <<: *joueur-common
    container_name: scribe_joueur_ch_ouest
    network_mode: host
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SCRIBE_CONFIG=/app/config_exo_ch_ouest.xml
      - SCRIBE_PORT=8664
      - DATABASE_URL=sqlite:////data/scribe_exo_ch_ouest.db
    volumes:
      - scribe_exo_data:/data

  # ── Instance joueur 6 — CLINIQUE_DEMO ──────────────────────────────────
  joueur_clinique_demo:
    <<: *joueur-common
    container_name: scribe_joueur_clinique_demo
    network_mode: host
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SCRIBE_CONFIG=/app/config_exo_clinique_demo.xml
      - SCRIBE_PORT=8665
      - DATABASE_URL=sqlite:////data/scribe_exo_clinique_demo.db
    volumes:
      - scribe_exo_data:/data

  # ── Instance joueur 7 — CH_NORD_2 (slot disponible) ────────────────────
  # Pour ajouter un 7ᵉ site : créer config_exo_ch_nord_2.xml et décommenter.
  # joueur_ch_nord_2:
  #   <<: *joueur-common
  #   container_name: scribe_joueur_ch_nord_2
  #   network_mode: host
  #   environment:
  #     - LOG_LEVEL=${LOG_LEVEL:-info}
  #     - SCRIBE_CONFIG=/app/config_exo_ch_nord_2.xml
  #     - SCRIBE_PORT=8666
  #     - DATABASE_URL=sqlite:////data/scribe_exo_ch_nord_2.db
  #   volumes:
  #     - scribe_exo_data:/data
  #   command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8666", "--workers", "1"]

volumes:
  scribe_exo_data:
    driver: local
