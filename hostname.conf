# SCRIBE — External hostname configuration
#
# This file declares the hostname under which SCRIBE is reachable
# from outside (user browsers).
#
# Read at startup by main.py to configure:
#   - CSP frame-ancestors (allow iframe of player instances in
#     animator console for exercise mode from this hostname)
#   - CORS connect-src
#   - URLs generated for iframe auto-login in exercise mode
#
# Override possible via:
#   - SCRIBE_EXTERNAL_HOST environment variable (priority 1)
#   - UI: http://<hostname>:9000/setup_hostname.html
#
# First non-empty non-comment line = hostname.
# Replace with your own hostname (FQDN or IP).

your-server.example.com
