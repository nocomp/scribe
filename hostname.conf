# SCRIBE — Configuration hostname externe
#
# Ce fichier indique le nom d'hôte par lequel SCRIBE est accessible
# de l'extérieur (depuis les navigateurs des utilisateurs).
#
# Il est lu au démarrage par main.py pour configurer :
#   - Le CSP frame-ancestors (autoriser l'iframing des instances joueurs
#     dans la console animateur exercice depuis ce hostname)
#   - Les CORS connect-src
#   - Les URLs générées pour l'iframe auto-login mode exercice
#
# Pour modifier sans toucher au fichier, possible via :
#   - Variable d'environnement SCRIBE_EXTERNAL_HOST (priorité 1)
#   - UI : http://<hostname>:9000/setup_hostname.html
#
# Première ligne non vide non commentée = hostname.

