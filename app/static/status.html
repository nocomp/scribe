<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>État du système — SCRIBE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-france:#000091;--blue-france-hover:#1212ff;--rouge-marianne:#e1000f;
  --bg:#f7f7fb;--surface:#ffffff;--surface2:#f6f6f6;
  --border:#dddddd;--border-strong:#929292;
  --text:#161616;--muted:#666666;--muted2:#7b7b7b;
  --green:#18753c;--green-bg:#e3fdeb;--green-border:#b8fec9;
  --yellow:#b34000;--yellow-bg:#feecc2;--yellow-border:#fcc63a;
  --orange:#b34000;--orange-bg:#ffe9c8;--orange-border:#ffca9e;
  --red:#ce0500;--red-bg:#ffe9e9;--red-border:#ffc6c6;
  --blue:#0063cb;--blue-bg:#e8edff;--blue-border:#c2d1ff;
  --mono:ui-monospace,'Courier New',monospace;
  --radius:4px;
}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:"Marianne",system-ui,-apple-system,arial,sans-serif;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--blue-france);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--blue-france-hover)}

/* EN-TÊTE (DSFR) */
.hdr{background:linear-gradient(135deg,#000091,#1e4ec4);color:#fff;box-shadow:0 2px 8px rgba(0,0,60,.15)}
.hdr-inner{max-width:960px;margin:0 auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hdr-left h1{font-size:22px;font-weight:700;color:#fff;letter-spacing:-.01em}
.hdr-left .sub{font-size:13px;color:rgba(255,255,255,.85);margin-top:4px}
.hdr-ts{font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap}

/* BANDEAU DE NIVEAU (alerte DSFR) */
.banner{max-width:960px;margin:24px auto 0;padding:0 24px}
.banner-card{border-radius:12px;border:1px solid;border-left-width:.35rem;padding:18px 22px;display:flex;align-items:flex-start;gap:14px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,30,.05)}
.banner-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:5px}
.banner-level{font-size:16px;font-weight:700}
.banner-msg{font-size:15px;color:var(--text);margin-top:4px;line-height:1.5}
.banner-by{font-size:12px;color:var(--muted);margin-top:8px}
.level-OPERATIONNEL .banner-card{background:var(--green-bg);border-color:var(--green)}
.level-OPERATIONNEL .banner-dot{background:var(--green)}
.level-OPERATIONNEL .banner-level{color:var(--green)}
.level-PERTURBE .banner-card{background:var(--yellow-bg);border-color:var(--yellow)}
.level-PERTURBE .banner-dot{background:var(--yellow)}
.level-PERTURBE .banner-level{color:var(--yellow)}
.level-INCIDENT_MAJEUR .banner-card{background:var(--red-bg);border-color:var(--red)}
.level-INCIDENT_MAJEUR .banner-dot{background:var(--red)}
.level-INCIDENT_MAJEUR .banner-level{color:var(--red)}
.level-MAINTENANCE .banner-card{background:var(--blue-bg);border-color:var(--blue)}
.level-MAINTENANCE .banner-dot{background:var(--blue)}
.level-MAINTENANCE .banner-level{color:var(--blue)}

/* CORPS */
.main{max-width:960px;margin:0 auto;padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

/* CARTES (DSFR) */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,30,.05);overflow:hidden;margin-bottom:20px}
.card-hdr{padding:14px 20px;border-bottom:1px solid var(--border);background:#f5f5fe;display:flex;align-items:center;gap:8px}
.card-hdr h2{font-size:14px;font-weight:700;color:#000091}
.card-hdr .count{font-size:12px;color:var(--muted);margin-left:auto}
.card-body{padding:0}

/* SERVICES + badges (badge DSFR) */
.svc-row{display:flex;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);gap:12px}
.svc-row:last-child{border-bottom:none}
.svc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.svc-label{font-size:14px;flex:1;color:var(--text)}
.svc-badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:4px 8px;border-radius:var(--radius);white-space:nowrap}
.s-OK{background:var(--green-bg);color:var(--green)}
.s-PERTURBE{background:var(--yellow-bg);color:var(--yellow)}
.s-HS{background:var(--red-bg);color:var(--red)}
.s-MAINTENANCE{background:var(--blue-bg);color:var(--blue)}
.dot-OK{background:var(--green)}
.dot-PERTURBE{background:var(--yellow)}
.dot-HS{background:var(--red)}
.dot-MAINTENANCE{background:var(--blue)}

/* QUESTIONS FRÉQUENTES */
.faq-item{padding:16px 20px;border-bottom:1px solid var(--border)}
.faq-item:last-child{border-bottom:none}
.faq-q{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px}
.faq-r{font-size:14px;color:var(--muted);line-height:1.6}

/* CHRONOLOGIE */
.chron-item{display:flex;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border)}
.chron-item:last-child{border-bottom:none}
.chron-line{display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding-top:5px}
.chron-dot{width:9px;height:9px;border-radius:50%;background:var(--blue-france);flex-shrink:0}
.chron-stem{width:2px;flex:1;background:var(--border);margin:3px 0;min-height:16px}
.chron-item:last-child .chron-stem{display:none}
.chron-content{flex:1}
.chron-ts{font-size:12px;color:var(--muted2);margin-bottom:3px}
.chron-texte{font-size:14px;color:var(--text);line-height:1.5}
.chron-by{font-size:12px;color:var(--muted2);margin-top:3px}

/* PIED (DSFR) */
.footer{border-top:2px solid var(--blue-france);background:var(--surface);margin-top:12px}
.footer,.footer *{max-width:none}
.footer{max-width:960px;margin:12px auto 0;padding:20px 24px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer-left{font-size:12px;color:var(--muted)}
.footer-qr{text-align:right}
.qr-label{font-size:11px;color:var(--muted2);margin-top:4px}

/* AUCUN STATUT */
.no-status{max-width:960px;margin:64px auto;padding:0 24px;text-align:center}
.no-status h2{font-size:20px;font-weight:700;color:var(--text);margin-bottom:10px}
.no-status p{font-size:15px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div style="text-align:center;padding:40px;color:#000091;font-size:13px">Chargement…</div>
</div>

<script>
const LABELS = {
  OPERATIONNEL:   '✓ Système opérationnel',
  PERTURBE:       '⚠ Système perturbé',
  INCIDENT_MAJEUR:'✕ Incident majeur en cours',
  MAINTENANCE:    '↻ Maintenance en cours',
};
const SVC_LABELS = { OK:'Opérationnel', PERTURBE:'Perturbé', HS:'Hors service', MAINTENANCE:'Maintenance' };

function fmt(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})
    + ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function svcRow(s){
  return `<div class="svc-row">
    <div class="svc-dot dot-${s.statut||'OK'}"></div>
    <div class="svc-label">${s.label}</div>
    <span class="svc-badge s-${s.statut||'OK'}">${SVC_LABELS[s.statut]||s.statut}</span>
  </div>`;
}

async function load(){
  const app = document.getElementById('app');
  try{
    const urlParams = new URLSearchParams(window.location.search);
    const siteIdParam = urlParams.get('site_id') || '0';
    // Essayer le site_id demandé, sinon fallback sur le premier statut publié
    let r = await fetch(`/api/v1/status/public?site_id=${siteIdParam}`);
    let d = await r.json();
    // Si pas publié et qu'on cherche le global, tenter all-published pour trouver un publié
    if (!d.published && siteIdParam === '0') {
      try {
        const allR = await fetch('/api/v1/status/all-published');
        const allD = await allR.json();
        if (Array.isArray(allD) && allD.length > 0) {
          // Prendre le premier publié
          d = allD[0];
        }
      } catch(e) {}
    }
    const etab = d.etablissement || {};

    if(!d.published){
      app.innerHTML = `
        <div class="hdr"><div class="hdr-inner">
          <div class="hdr-left">
            <h1>${etab.nom||'Établissement de santé'}</h1>
            <div class="sub">État du système d'information</div>
          </div>
        </div></div>
        <div class="no-status">
          <h2>Aucun point de situation publié</h2>
          <p>L'équipe n'a pas encore publié de point de situation.<br>Veuillez réessayer ultérieurement ou contacter directement l'établissement.</p>
        </div>`;
      return;
    }

    const lvl = d.niveau_global || 'OPERATIONNEL';
    const siSvcs = d.services_si || [];
    const pecSvcs = d.prise_en_charge || [];
    const faq = (d.faq || []).filter(f=>f.visible && f.reponse);
    const chrons = d.chronologie || [];
    const lignes = d.lignes_repondeur || [];
    const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const nbPertSI  = siSvcs.filter(s=>s.statut!=='OK').length;
    const nbPertPEC = pecSvcs.filter(s=>s.statut!=='OK').length;

    app.innerHTML = `
<div class="hdr">
  <div class="hdr-inner">
    <div class="hdr-left">
      <h1>${etab.nom||'Établissement de santé'}${d.site_nom && d.site_id ? ` <span style="font-size:13px;font-weight:400;color:#6b7494">— ${d.site_nom}</span>` : ''}</h1>
      <div class="sub">État du système d'information — Point de situation officiel</div>
    </div>
    <div class="hdr-ts">Mis à jour le ${fmt(d.updated_at)}</div>
  </div>
</div>

<div class="banner level-${lvl}">
  <div class="banner-inner">
    <div class="banner-card">
      <div class="banner-dot"></div>
      <div>
        <div class="banner-level">${LABELS[lvl]||lvl}</div>
        ${d.message_public?`<div class="banner-msg">${d.message_public}</div>`:''}
        ${d.updated_by?`<div class="banner-by">Publié par ${d.updated_by}</div>`:''}
      </div>
    </div>
  </div>
</div>

<div class="main">
  ${lignes.length?`
  <div class="card" style="margin-bottom:20px;border-left:4px solid var(--blue-france,#000091)">
    <div class="card-hdr"><h2>📞 Numéros d'information</h2></div>
    <div class="card-body">${lignes.map(l=>`
      <div class="faq-item" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div>
          <div class="faq-q">${esc(l.libelle)}</div>
          ${l.langues && l.langues.length?`<div class="faq-r" style="font-size:11px">${l.langues.map(x=>esc(String(x).toUpperCase())).join(' · ')}</div>`:''}
        </div>
        <a href="tel:${esc((l.numero||'').replace(/\s+/g,''))}" style="font-size:18px;font-weight:700;color:var(--blue-france,#000091);text-decoration:none;font-family:monospace">${esc(l.numero)}</a>
      </div>`).join('')}
    </div>
  </div>`:''}

  <div class="grid2">
    <div class="card">
      <div class="card-hdr">
        <h2>Système d'information</h2>
        ${nbPertSI?`<span class="count">${nbPertSI} service(s) perturbé(s)</span>`:'<span class="count" style="color:var(--green)">Tous opérationnels</span>'}
      </div>
      <div class="card-body">${siSvcs.map(svcRow).join('')}</div>
    </div>
    <div class="card">
      <div class="card-hdr">
        <h2>Prise en charge patients</h2>
        ${nbPertPEC?`<span class="count">${nbPertPEC} service(s) impacté(s)</span>`:'<span class="count" style="color:var(--green)">Maintenue</span>'}
      </div>
      <div class="card-body">${pecSvcs.map(svcRow).join('')}</div>
    </div>
  </div>

  ${faq.length?`
  <div class="card">
    <div class="card-hdr"><h2>Questions fréquentes</h2></div>
    <div class="card-body">${faq.map(f=>`
      <div class="faq-item">
        <div class="faq-q">${f.question}</div>
        <div class="faq-r">${f.reponse}</div>
      </div>`).join('')}
    </div>
  </div>`:''}

  ${chrons.length?`
  <div class="card">
    <div class="card-hdr"><h2>Chronologie</h2></div>
    <div class="card-body">${chrons.map((c,i)=>`
      <div class="chron-item">
        <div class="chron-line">
          <div class="chron-dot"></div>
          ${i<chrons.length-1?'<div class="chron-stem"></div>':''}
        </div>
        <div class="chron-content">
          <div class="chron-ts">${fmt(c.ts)}</div>
          <div class="chron-texte">${c.texte}</div>
          ${c.publie_par?`<div class="chron-by">${c.publie_par}</div>`:''}
        </div>
      </div>`).join('')}
    </div>
  </div>`:''}

</div>
<div class="footer">
  <div class="footer-left">
    ${etab.nom||''} — Cette page se rafraîchit automatiquement toutes les 60 secondes.<br>
    URL permanente : <a href="/status">/status</a> &nbsp;|&nbsp; JSON : <a href="/api/v1/status/public">/api/v1/status/public</a>
  </div>
</div>`;
  }catch(e){
    app.innerHTML = `<div style="text-align:center;padding:40px;color:#dc2626;font-family:monospace;font-size:13px">Erreur de chargement : ${e.message}</div>`;
  }
}
load();
</script>
</body>
</html>
